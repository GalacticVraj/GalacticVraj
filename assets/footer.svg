<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" fill="none" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="footer-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.5" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="footer-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="120" fill="url(#footer-bg)"/>
  <rect x="140" y="42" width="720" height="2" fill="url(#footer-line)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="78" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="14" letter-spacing="4" fill="#2dd4bf">
    thank you for visiting
  </text>
</svg>
