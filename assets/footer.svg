<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" fill="none" role="img" aria-label="footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fneb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#34d399"/>
      <animate attributeName="x1" values="0;0.6;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.6;1.4;0.6" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ftail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1" stop-color="#eafffb" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="130" fill="url(#fneb)"/>

  <g>
    <circle cx="177.6" cy="62.0" r="1.64" fill="#fbbf24"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.8s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="482.8" cy="96.5" r="1.85" fill="#eafffb"><animate attributeName="opacity" values="0.06;1;0.06" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="507.6" cy="72.0" r="1.69" fill="#fbbf24"><animate attributeName="opacity" values="0.17;1;0.17" dur="4.8s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="604.4" cy="30.7" r="1.06" fill="#eafffb"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" begin="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="696.0" cy="107.9" r="1.92" fill="#2dd4bf"><animate attributeName="opacity" values="0.24;1;0.24" dur="2.9s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="142.9" cy="21.9" r="1.27" fill="#eafffb"><animate attributeName="opacity" values="0.06;1;0.06" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="779.4" cy="110.3" r="0.9" fill="#eafffb"><animate attributeName="opacity" values="0.08;1;0.08" dur="4.2s" begin="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="960.1" cy="33.0" r="1.94" fill="#eafffb"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.3s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="166.9" cy="57.2" r="1.37" fill="#eafffb"><animate attributeName="opacity" values="0.11;1;0.11" dur="3.1s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="27.2" cy="71.2" r="1.27" fill="#fbbf24"><animate attributeName="opacity" values="0.17;1;0.17" dur="2.3s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="953.4" cy="20.9" r="1.89" fill="#eafffb"><animate attributeName="opacity" values="0.07;1;0.07" dur="2.8s" begin="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="47.0" cy="96.8" r="1.05" fill="#eafffb"><animate attributeName="opacity" values="0.23;1;0.23" dur="2.6s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="407.5" cy="69.2" r="1.37" fill="#eafffb"><animate attributeName="opacity" values="0.11;1;0.11" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="426.5" cy="16.3" r="1.92" fill="#eafffb"><animate attributeName="opacity" values="0.07;1;0.07" dur="4.0s" begin="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="73.6" cy="106.4" r="1.29" fill="#eafffb"><animate attributeName="opacity" values="0.24;1;0.24" dur="3.1s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="619.8" cy="12.9" r="1.62" fill="#eafffb"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.8s" begin="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="206.5" cy="43.6" r="1.1" fill="#eafffb"><animate attributeName="opacity" values="0.15;1;0.15" dur="4.3s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="274.2" cy="99.6" r="1.99" fill="#eafffb"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="514.0" cy="36.0" r="1.28" fill="#fbbf24"><animate attributeName="opacity" values="0.18;1;0.18" dur="4.0s" begin="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="829.3" cy="52.8" r="1.36" fill="#eafffb"><animate attributeName="opacity" values="0.12;1;0.12" dur="4.1s" begin="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="406.2" cy="47.6" r="0.77" fill="#eafffb"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="431.8" cy="14.3" r="1.56" fill="#fbbf24"><animate attributeName="opacity" values="0.24;1;0.24" dur="3.3s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glowing aurora wave -->
  <path filter="url(#fglow)" fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round"
        d="M0,70 C 150,30 300,110 500,70 C 700,30 850,110 1000,70">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,70 C 150,30 300,110 500,70 C 700,30 850,110 1000,70;
              M0,70 C 150,110 300,30 500,70 C 700,110 850,30 1000,70;
              M0,70 C 150,30 300,110 500,70 C 700,30 850,110 1000,70"/>
  </path>

  <!-- a comet skimming the footer -->
  <g filter="url(#fglow)">
    <g>
      <path d="M0,-2.4 L-48,0 L0,2.4 Z" fill="url(#ftail)"/>
      <circle r="2.8" fill="#eafffb"/>
      <animateMotion path="M -80,40 C 300,90 700,20 1080,70" begin="1s" dur="7s" repeatCount="indefinite" rotate="auto"/>
    </g>
  </g>
</svg>
