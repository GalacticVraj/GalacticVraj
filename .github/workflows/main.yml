# ────────────────────────────────────────────────────────────────
#  Generates a NEON snake that eats your contribution graph.
#  Output lands on the "output" branch; the README points at it.
#  Runs every 12h + on manual trigger. First run: Actions tab → Run.
# ────────────────────────────────────────────────────────────────
name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: build snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=#2dd4bf&color_dots=#0a0f1e,#134e4a,#0f766e,#2dd4bf,#fbbf24
            dist/snake-dark.svg?palette=github-dark

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
