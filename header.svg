        <path d="M0,-2.6 L-54,0 L0,2.6 Z" fill="url(#tail)"/>
        <circle r="3.1" fill="#eafffb"/>
        <animateMotion path="M 1090,30 C 700,120 300,20 -90,120" begin="5.5s" dur="9s" repeatCount="indefinite" rotate="auto"/>
