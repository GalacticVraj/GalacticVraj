  <!-- flying comets -->
  <g filter="url(#glow)">
      <g>
        <path d="M0,-2.6 L-54,0 L0,2.6 Z" fill="url(#tail)"/>
        <circle r="3.1" fill="#eafffb"/>
        <animateMotion path="M -90,60 C 260,8 600,110 1090,50" begin="0s" dur="6.5s" repeatCount="indefinite" rotate="auto"/>
      </g>
    </g>
  <g filter="url(#glow)">
      <g>
        <path d="M0,-2.6 L-54,0 L0,2.6 Z" fill="url(#tail)"/>
        <circle r="3.1" fill="#eafffb"/>
        <animateMotion path="M -90,210 C 320,150 720,250 1090,190" begin="3.2s" dur="8s" repeatCount="indefinite" rotate="auto"/>
      </g>
    </g>
  <g filter="url(#glow)">
